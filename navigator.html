<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoadSense — Satellite-Powered Route Safety</title>
  <meta name="description" content="RoadSense uses satellite imagery and machine learning to analyze road surface conditions, helping you find the safest and fastest routes with real-time road quality data.">
  <meta name="theme-color" content="#0d1117">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    :root {
      --bg-root: #0d1117;
      --bg-panel: #161b22;
      --bg-card: #1c2330;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent-blue: #378ADD;
      --accent-green: #639922;
      --color-good: #3fb950;
      --color-unpaved: #d29922;
      --color-damaged: #f85149;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --panel-width: 340px;
      --radius: 8px;
      --radius-sm: 6px;
      --transition: 0.2s ease;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: var(--font);
      background: var(--bg-root);
      color: var(--text);
    }

    /* ── Layout ── */
    .app {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    .panel {
      width: var(--panel-width);
      min-width: var(--panel-width);
      height: 100vh;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      z-index: 1000;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .panel::-webkit-scrollbar { width: 6px; }
    .panel::-webkit-scrollbar-track { background: transparent; }
    .panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .panel-inner {
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .map-container {
      flex: 1;
      height: 100vh;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* ── Branding ── */
    .branding {}

    .brand-name {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      font-size: 28px;
      line-height: 1;
    }

    .brand-tagline {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin-top: 16px;
    }

    /* ── Inputs ── */
    .input-section {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .input-group input {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg-root);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .input-group input::placeholder {
      color: #484f58;
    }

    .input-group input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(55, 138, 221, 0.15);
    }

    /* ── Vehicle Toggle ── */
    .vehicle-toggle {
      display: flex;
      gap: 6px;
    }

    .vehicle-pill {
      flex: 1;
      padding: 8px 4px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-muted);
      font-family: var(--font);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      text-align: center;
      white-space: nowrap;
      line-height: 1.3;
    }

    .vehicle-pill:hover {
      border-color: var(--accent-blue);
      color: var(--text);
    }

    .vehicle-pill.active {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      color: #fff;
      font-weight: 600;
    }

    /* ── Action Button ── */
    .btn-find {
      width: 100%;
      padding: 13px 20px;
      background: linear-gradient(135deg, #2188ff 0%, #1fa879 100%);
      border: none;
      border-radius: var(--radius);
      color: #fff;
      font-family: var(--font);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition);
      letter-spacing: 0.3px;
      position: relative;
      overflow: hidden;
    }

    .btn-find::before {
      content: '';
      position: absolute;
      top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      transition: left 0.5s ease;
    }

    .btn-find:hover:not(:disabled)::before {
      left: 100%;
    }

    .btn-find:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(33, 136, 255, 0.3);
    }

    .btn-find:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-find:disabled {
      background: #30363d;
      color: #484f58;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* ── ML Status Badge ── */
    .ml-badge {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
    }

    .ml-badge.visible {
      display: flex;
    }

    .ml-badge.active {
      background: rgba(63, 185, 80, 0.1);
      border: 1px solid rgba(63, 185, 80, 0.25);
      color: var(--color-good);
    }

    .ml-badge.inactive {
      background: rgba(210, 153, 34, 0.1);
      border: 1px solid rgba(210, 153, 34, 0.25);
      color: var(--color-unpaved);
    }

    .ml-dot {
      font-size: 10px;
      line-height: 1;
    }

    /* ── Loading Spinner ── */
    .loading {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 24px 0;
    }

    .loading.visible {
      display: flex;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* ── Error Message ── */
    .error-card {
      display: none;
      padding: 14px 16px;
      background: rgba(248, 81, 73, 0.08);
      border: 1px solid rgba(248, 81, 73, 0.25);
      border-radius: var(--radius-sm);
      color: var(--color-damaged);
      font-size: 13px;
      font-weight: 500;
      gap: 8px;
      align-items: flex-start;
      line-height: 1.5;
    }

    .error-card.visible {
      display: flex;
    }

    .error-icon {
      font-size: 16px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* ── Route Cards ── */
    .route-results {
      display: none;
      flex-direction: column;
      gap: 14px;
    }

    .route-results.visible {
      display: flex;
    }

    .route-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
      overflow: hidden;
    }

    .route-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
    }

    .route-card.fastest::before {
      background: var(--accent-blue);
    }

    .route-card.safest::before {
      background: var(--accent-green);
    }

    .route-card:hover {
      border-color: #444c56;
      transform: translateX(2px);
    }

    .route-card.highlighted {
      border-color: #58a6ff;
      box-shadow: 0 0 16px rgba(88, 166, 255, 0.12);
    }

    .route-card.dimmed {
      opacity: 0.45;
    }

    @keyframes cardPulse {
      0%, 100% { box-shadow: 0 0 0 rgba(88, 166, 255, 0); }
      50% { box-shadow: 0 0 20px rgba(88, 166, 255, 0.2); }
    }

    .route-card.pulse {
      animation: cardPulse 0.6s ease 2;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
    }

    .badge-recommended {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      background: rgba(99, 153, 34, 0.2);
      color: var(--accent-green);
      padding: 3px 8px;
      border-radius: 10px;
      border: 1px solid rgba(99, 153, 34, 0.35);
    }

    .stats-row {
      display: flex;
      gap: 20px;
      margin-bottom: 14px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ── Segmented Bar ── */
    .seg-bar-container {
      margin-bottom: 8px;
    }

    .seg-bar {
      display: flex;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      background: var(--border);
    }

    .seg-bar span {
      transition: width 0.5s ease;
    }

    .seg-good { background: var(--color-good); }
    .seg-unpaved { background: var(--color-unpaved); }
    .seg-damaged { background: var(--color-damaged); }

    .seg-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .seg-legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .seg-legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Warnings ── */
    .warnings {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .warning-row {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      font-size: 12px;
      color: var(--color-damaged);
      line-height: 1.45;
      padding: 6px 8px;
      background: rgba(248, 81, 73, 0.06);
      border-radius: var(--radius-sm);
    }

    .warning-icon {
      flex-shrink: 0;
      font-size: 13px;
    }

    /* ── Extra Note ── */
    .extra-note {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-muted);
      font-style: italic;
    }

    /* ── Leaflet Overrides ── */
    .leaflet-container {
      background: var(--bg-root) !important;
      font-family: var(--font) !important;
    }

    .leaflet-control-zoom a {
      background: var(--bg-panel) !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
    }

    .leaflet-control-zoom a:hover {
      background: var(--bg-card) !important;
    }

    .leaflet-control-attribution {
      background: rgba(22, 27, 34, 0.85) !important;
      color: var(--text-muted) !important;
      font-size: 10px !important;
    }

    .leaflet-control-attribution a {
      color: var(--accent-blue) !important;
    }

    @keyframes polyPulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }

    /* ── Responsive ── */
    @media (max-width: 767px) {
      .app {
        flex-direction: column;
      }

      .panel {
        width: 100%;
        min-width: 100%;
        height: auto;
        max-height: 50vh;
        border-right: none;
        border-bottom: 1px solid var(--border);
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
      }

      .map-container {
        height: 50vh;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <!-- ── Left Panel ── -->
    <aside class="panel" id="panel">
      <div class="panel-inner">

        <!-- Branding -->
        <header class="branding">
          <div class="brand-name"><span class="brand-icon">🛰️</span> RoadSense</div>
          <p class="brand-tagline">satellite-powered road safety</p>
          <div class="divider"></div>
        </header>

        <!-- Input Section -->
        <section class="input-section">
          <div class="input-group">
            <label for="input-from">From</label>
            <input type="text" id="input-from" placeholder="Place name or lat,lng" autocomplete="off">
          </div>
          <div class="input-group">
            <label for="input-to">To</label>
            <input type="text" id="input-to" placeholder="Place name or lat,lng" autocomplete="off">
          </div>
        </section>

        <!-- Vehicle Toggle -->
        <nav class="vehicle-toggle" aria-label="Vehicle type">
          <button class="vehicle-pill active" data-vehicle="car">🚗 Car</button>
          <button class="vehicle-pill" data-vehicle="motorcycle">🏍️ Bike</button>
          <button class="vehicle-pill" data-vehicle="truck">🚚 Truck</button>
          <button class="vehicle-pill" data-vehicle="pedestrian">🚶 Walk</button>
        </nav>

        <!-- Action Button -->
        <button class="btn-find" id="btn-find">Find Routes</button>

        <!-- ML Status Badge -->
        <div class="ml-badge" id="ml-badge">
          <span class="ml-dot"></span>
          <span class="ml-text"></span>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">
          <div class="spinner"></div>
          <span class="loading-text">Analyzing routes...</span>
        </div>

        <!-- Error -->
        <div class="error-card" id="error-card">
          <span class="error-icon">❌</span>
          <span class="error-text" id="error-text"></span>
        </div>

        <!-- Route Results -->
        <section class="route-results" id="route-results">
          <article class="route-card fastest" id="card-fastest" tabindex="0">
            <div class="card-header">
              <span class="card-title">⚡ Fastest Route</span>
            </div>
            <div class="stats-row">
              <div class="stat">
                <span class="stat-value" id="fast-dist">—</span>
                <span class="stat-label">Distance</span>
              </div>
              <div class="stat">
                <span class="stat-value" id="fast-time">—</span>
                <span class="stat-label">Est. Time</span>
              </div>
            </div>
            <div class="seg-bar-container">
              <div class="seg-bar" id="fast-bar"></div>
              <div class="seg-legend" id="fast-legend"></div>
            </div>
            <div class="warnings" id="fast-warnings"></div>
          </article>

          <article class="route-card safest" id="card-safest" tabindex="0">
            <div class="card-header">
              <span class="card-title">🛡️ Safest Route</span>
              <span class="badge-recommended">Recommended</span>
            </div>
            <div class="stats-row">
              <div class="stat">
                <span class="stat-value" id="safe-dist">—</span>
                <span class="stat-label">Distance</span>
              </div>
              <div class="stat">
                <span class="stat-value" id="safe-time">—</span>
                <span class="stat-label">Est. Time</span>
              </div>
            </div>
            <div class="seg-bar-container">
              <div class="seg-bar" id="safe-bar"></div>
              <div class="seg-legend" id="safe-legend"></div>
            </div>
            <div class="warnings" id="safe-warnings"></div>
            <div class="extra-note" id="safe-extra" style="display:none;"></div>
          </article>
        </section>
      </div>
    </aside>

    <!-- ── Map ── -->
    <section class="map-container" aria-label="Route map">
      <div id="map"></div>
    </section>
  </main>

  <script>
    /* ───────────────────────── State ───────────────────────── */
    let selectedVehicle = 'car';
    let fastestPolyline = null;
    let safestPolyline  = null;
    let purplePolyline  = null;
    let originMarker    = null;
    let destMarker      = null;
    let currentData     = null;

    /* ───────────────────────── Map Init ───────────────────── */
    const map = L.map('map', {
      center: [20, 78],
      zoom: 5,
      zoomControl: true
    });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 20
    }).addTo(map);

    /* ───────────────────────── DOM Refs ───────────────────── */
    const $from     = document.getElementById('input-from');
    const $to       = document.getElementById('input-to');
    const $btn      = document.getElementById('btn-find');
    const $mlBadge  = document.getElementById('ml-badge');
    const $loading  = document.getElementById('loading');
    const $error    = document.getElementById('error-card');
    const $errText  = document.getElementById('error-text');
    const $results  = document.getElementById('route-results');
    const $cardFast = document.getElementById('card-fastest');
    const $cardSafe = document.getElementById('card-safest');
    const pills     = document.querySelectorAll('.vehicle-pill');

    /* ───────────────────────── Vehicle Pills ──────────────── */
    pills.forEach(pill => {
      pill.addEventListener('click', () => {
        pills.forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        selectedVehicle = pill.dataset.vehicle;
      });
    });

    /* ───────────────────────── Helpers ─────────────────────── */
    function show(el)  { el.classList.add('visible'); }
    function hide(el)  { el.classList.remove('visible'); }
    function setLoading(on) {
      if (on) {
        show($loading);
        $btn.disabled = true;
        $btn.textContent = 'Analyzing…';
        hide($error);
        hide($results);
        hide($mlBadge);
      } else {
        hide($loading);
        $btn.disabled = false;
        $btn.textContent = 'Find Routes';
      }
    }

    function showError(msg) {
      $errText.textContent = msg;
      show($error);
    }

    function fmt(v) {
      return v % 1 === 0 ? v.toString() : v.toFixed(1);
    }

    function buildBar(containerId, legendId, segments) {
      const bar = document.getElementById(containerId);
      const legend = document.getElementById(legendId);
      const total = segments.good_km + segments.unpaved_km + segments.damaged_km;
      if (total === 0) {
        bar.innerHTML = '';
        legend.innerHTML = '<span style="color:var(--text-muted)">No segment data</span>';
        return;
      }
      const gPct = (segments.good_km / total * 100).toFixed(1);
      const uPct = (segments.unpaved_km / total * 100).toFixed(1);
      const dPct = (segments.damaged_km / total * 100).toFixed(1);

      bar.innerHTML =
        `<span class="seg-good" style="width:${gPct}%"></span>` +
        `<span class="seg-unpaved" style="width:${uPct}%"></span>` +
        `<span class="seg-damaged" style="width:${dPct}%"></span>`;

      legend.innerHTML =
        `<span class="seg-legend-item"><span class="seg-legend-dot" style="background:var(--color-good)"></span>${fmt(segments.good_km)} km paved</span>` +
        `<span class="seg-legend-item"><span class="seg-legend-dot" style="background:var(--color-unpaved)"></span>${fmt(segments.unpaved_km)} km unpaved</span>` +
        `<span class="seg-legend-item"><span class="seg-legend-dot" style="background:var(--color-damaged)"></span>${fmt(segments.damaged_km)} km damaged</span>`;
    }

    function buildWarnings(containerId, warnings) {
      const el = document.getElementById(containerId);
      if (!warnings || warnings.length === 0) {
        el.innerHTML = '';
        return;
      }
      el.innerHTML = warnings.map(w =>
        `<div class="warning-row"><span class="warning-icon">⚠️</span><span>${escHtml(w)}</span></div>`
      ).join('');
    }

    function escHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    /* ───────────────────────── Map Helpers ─────────────────── */
    function clearMap() {
      [fastestPolyline, safestPolyline, purplePolyline, originMarker, destMarker].forEach(l => {
        if (l) map.removeLayer(l);
      });
      fastestPolyline = safestPolyline = purplePolyline = originMarker = destMarker = null;
    }

    function polylinesIdentical(a, b) {
      if (a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) {
        if (a[i][0] !== b[i][0] || a[i][1] !== b[i][1]) return false;
      }
      return true;
    }

    function makeCircleMarker(latlng, color) {
      return L.circleMarker(latlng, {
        radius: 8,
        fillColor: color,
        color: '#ffffff',
        weight: 2,
        fillOpacity: 1
      }).addTo(map);
    }

    /* ───────────────────────── Highlight Logic ─────────────── */
    function highlightRoute(which) {
      /* which: 'fastest' | 'safest' */
      const isSame = purplePolyline !== null;
      if (isSame) {
        /* single purple polyline, just highlight corresponding card */
        $cardFast.classList.remove('highlighted', 'dimmed', 'pulse');
        $cardSafe.classList.remove('highlighted', 'dimmed', 'pulse');
        if (which === 'fastest') {
          $cardFast.classList.add('highlighted', 'pulse');
          $cardSafe.classList.add('dimmed');
        } else {
          $cardSafe.classList.add('highlighted', 'pulse');
          $cardFast.classList.add('dimmed');
        }
        return;
      }

      if (which === 'fastest') {
        if (fastestPolyline) fastestPolyline.setStyle({ weight: 8, opacity: 1 });
        if (safestPolyline)  safestPolyline.setStyle({ weight: 5, opacity: 0.3 });
        $cardFast.classList.add('highlighted', 'pulse');
        $cardFast.classList.remove('dimmed');
        $cardSafe.classList.remove('highlighted', 'pulse');
        $cardSafe.classList.add('dimmed');
      } else {
        if (safestPolyline)  safestPolyline.setStyle({ weight: 8, opacity: 1 });
        if (fastestPolyline) fastestPolyline.setStyle({ weight: 5, opacity: 0.3 });
        $cardSafe.classList.add('highlighted', 'pulse');
        $cardSafe.classList.remove('dimmed');
        $cardFast.classList.remove('highlighted', 'pulse');
        $cardFast.classList.add('dimmed');
      }
    }

    function resetHighlights() {
      if (fastestPolyline) fastestPolyline.setStyle({ weight: 5, opacity: 0.8 });
      if (safestPolyline)  safestPolyline.setStyle({ weight: 5, opacity: 0.8 });
      $cardFast.classList.remove('highlighted', 'dimmed', 'pulse');
      $cardSafe.classList.remove('highlighted', 'dimmed', 'pulse');
    }

    /* ───────────────────────── Card Click ──────────────────── */
    $cardFast.addEventListener('click', () => highlightRoute('fastest'));
    $cardSafe.addEventListener('click', () => highlightRoute('safest'));

    /* ───────────────────────── Render Results ──────────────── */
    function renderResults(data) {
      currentData = data;

      /* ML Badge */
      $mlBadge.className = 'ml-badge visible ' + (data.ml_active ? 'active' : 'inactive');
      $mlBadge.querySelector('.ml-dot').textContent = data.ml_active ? '🟢' : '🟡';
      $mlBadge.querySelector('.ml-text').textContent = data.ml_active
        ? 'Satellite imagery active'
        : 'OSM only — no satellite';

      /* Fastest Card */
      const f = data.fastest;
      document.getElementById('fast-dist').textContent = fmt(f.distance_km) + ' km';
      document.getElementById('fast-time').textContent = fmt(f.estimated_minutes) + ' min';
      buildBar('fast-bar', 'fast-legend', f.segments);
      buildWarnings('fast-warnings', f.warnings);

      /* Safest Card */
      const s = data.safest;
      document.getElementById('safe-dist').textContent = fmt(s.distance_km) + ' km';
      document.getElementById('safe-time').textContent = fmt(s.estimated_minutes) + ' min';
      buildBar('safe-bar', 'safe-legend', s.segments);
      buildWarnings('safe-warnings', s.warnings);

      /* Extra note */
      const $extra = document.getElementById('safe-extra');
      const distDiff = s.distance_km - f.distance_km;
      const timeDiff = s.estimated_minutes - f.estimated_minutes;
      if (distDiff > 0 || timeDiff > 0) {
        $extra.style.display = 'block';
        const parts = [];
        if (distDiff > 0) parts.push(`+${fmt(distDiff)} km`);
        if (timeDiff > 0) parts.push(`+${Math.round(timeDiff)} min`);
        $extra.textContent = parts.join(' · ') + ' vs fastest';
      } else {
        $extra.style.display = 'none';
      }

      show($results);

      /* ── Draw on map ── */
      clearMap();

      const identical = polylinesIdentical(f.polyline, s.polyline);

      if (identical) {
        purplePolyline = L.polyline(f.polyline, {
          color: '#7F77DD', weight: 5, opacity: 0.8, lineCap: 'round', lineJoin: 'round'
        }).addTo(map);
        purplePolyline.on('click', () => {
          /* toggle between fastest and safest highlight */
          if ($cardFast.classList.contains('highlighted')) {
            highlightRoute('safest');
          } else {
            highlightRoute('fastest');
          }
        });
      } else {
        /* Draw safest first (below), then fastest on top */
        safestPolyline = L.polyline(s.polyline, {
          color: '#639922', weight: 5, opacity: 0.8, lineCap: 'round', lineJoin: 'round'
        }).addTo(map);

        fastestPolyline = L.polyline(f.polyline, {
          color: '#378ADD', weight: 5, opacity: 0.8, lineCap: 'round', lineJoin: 'round'
        }).addTo(map);

        fastestPolyline.on('click', (e) => {
          L.DomEvent.stopPropagation(e);
          highlightRoute('fastest');
          $cardFast.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });

        safestPolyline.on('click', (e) => {
          L.DomEvent.stopPropagation(e);
          highlightRoute('safest');
          $cardSafe.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });
      }

      /* Markers */
      originMarker = makeCircleMarker(data.origin_coords, '#378ADD');
      destMarker   = makeCircleMarker(data.destination_coords, '#f85149');

      /* Fit bounds */
      const allCoords = [...f.polyline, ...s.polyline, data.origin_coords, data.destination_coords];
      const bounds = L.latLngBounds(allCoords);
      map.fitBounds(bounds, { padding: [40, 40] });

      resetHighlights();
    }

    /* ───────────────────────── API Call ────────────────────── */
    async function findRoutes() {
      const from = $from.value.trim();
      const to   = $to.value.trim();

      if (!from || !to) {
        showError('Please enter both origin and destination.');
        return;
      }

      setLoading(true);

      try {
        const res = await fetch(window.location.origin + '/navigate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            origin: from,
            destination: to,
            vehicle: selectedVehicle
          })
        });

        if (res.ok) {
          const data = await res.json();
          setLoading(false);
          renderResults(data);
        } else if (res.status === 400) {
          const errData = await res.json().catch(() => ({}));
          setLoading(false);
          showError(errData.error || 'Invalid request. Please check your inputs.');
        } else if (res.status === 404) {
          setLoading(false);
          showError('No route found between these locations.');
        } else {
          setLoading(false);
          showError('Something went wrong. Please try again later.');
        }
      } catch (err) {
        setLoading(false);
        showError('Network error — could not reach the server.');
      }
    }

    /* ───────────────────────── Events ──────────────────────── */
    $btn.addEventListener('click', findRoutes);

    /* Enter key on inputs triggers search */
    $from.addEventListener('keydown', e => { if (e.key === 'Enter') { $to.focus(); } });
    $to.addEventListener('keydown', e => { if (e.key === 'Enter') { findRoutes(); } });

    /* Click on map resets highlights */
    map.on('click', resetHighlights);
  </script>
</body>
</html>
